<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sheet Debug</title>
</head>
<body>
    <h1>Sheet Debug Test</h1>
    <div id="output"></div>
    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxG-5FV4YqoxTKYDOT5oFmsMmkB6ereIdg5TztHuJWLoaCEzq0NWXsrv17cfLUwfpN4Ug/exec';
        
        async function testSheetInfo() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing sheet info...</p>';
            
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getSheetInfo&pass=10900');
                const data = await response.json();
                output.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                output.innerHTML += '<p style="color:red;">Error: ' + error.message + '</p>';
            }
        }
        
        async function testListSheets() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing list sheets...</p>';
            
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=listAllSheets&pass=10900');
                const data = await response.json();
                output.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                output.innerHTML += '<p style="color:red;">Error: ' + error.message + '</p>';
            }
        }
        
        window.onload = function() {
            testSheetInfo();
            testListSheets();
        };
    </script>
</body>
</html>
