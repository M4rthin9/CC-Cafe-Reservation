<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจสอบสถานะการจอง — ทัณฑสถานบำบัดพิเศษกลาง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --blue: #185FA5; --blue-dark: #0C447C; --blue-light: #E6F1FB;
  --green: #3B6D11; --green-light: #EAF3DE;
  --gold: #C8922A; --gold-light: #FDF3E3;
  --red: #E24B4A; --red-light: #FFF0F0;
  --bg: #f0f4f9; --bg2: #ffffff;
  --border: #dde3ec; --text: #1a1d23; --text2: #6b7280;
  --radius: 12px; --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Sarabun', sans-serif; color: var(--text); min-height: 100vh; }
.app { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }

/* ── Header ── */
.header {
  text-align: center; margin-bottom: 1.5rem; padding: 1.5rem;
  background: linear-gradient(135deg, #0C3A6B 0%, #185FA5 100%);
  border-radius: var(--radius); color: #fff; position: relative; overflow: hidden;
}
.header::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 80% at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 60%);
}
.back-link {
  position: absolute; top: 14px; left: 14px;
  display: flex; align-items: center; gap: 4px;
  color: rgba(255,255,255,0.8); font-size: 13px; text-decoration: none; z-index: 1;
}
.back-link:hover { color: #fff; }
.hbadge {
  display: inline-block; background: rgba(200,146,42,0.3);
  border: 1px solid rgba(200,146,42,0.5); color: #f5d08a;
  font-size: 11px; padding: 3px 12px; border-radius: 20px;
  margin-bottom: 10px; letter-spacing: 0.5px; position: relative;
}
.header h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; position: relative; }
.header p  { font-size: 13px; color: rgba(255,255,255,0.7); position: relative; }

/* ── Search box ── */
.search-section {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem;
  margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.section-title {
  font-size: 13px; font-weight: 600; color: var(--text2);
  margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid var(--border); padding-bottom: 10px;
}
.search-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
.tab-btn {
  flex: 1; padding: 9px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); font-size: 13px; font-weight: 600;
  font-family: inherit; background: var(--bg); color: var(--text2);
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.tab-content { display: none; }
.tab-content.active { display: block; }
label { font-size: 13px; color: var(--text2); font-weight: 500; display: block; margin-bottom: 5px; }
input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 15px; background: var(--bg);
  color: var(--text); font-family: inherit; transition: border-color 0.15s;
}
input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); background: #fff; }

/* ── Buttons ── */
.btn-primary {
  width: 100%; padding: 13px; background: var(--blue); color: #fff;
  border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(24,95,165,0.25); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary {
  width: 100%; padding: 12px; background: var(--bg2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn-secondary:hover { border-color: var(--blue); color: var(--blue); }

/* ── Result card ── */
.result-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 1rem;
}
.result-header {
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px;
}
.result-ref { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.result-ref strong { font-size: 18px; font-weight: 700; color: var(--blue); letter-spacing: 2px; }
.result-body { padding: 1rem 1.25rem; }
.info-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); gap: 10px;
}
.info-row:last-child { border-bottom: none; }
.info-row .lbl { color: var(--text2); flex-shrink: 0; min-width: 110px; }
.info-row .val { font-weight: 600; text-align: right; }

/* ── Status pills ── */
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
.status-pending  { background: #FFF9E6; color: #C8922A; border: 1px solid rgba(200,146,42,0.3); }
.status-approved { background: var(--green-light); color: var(--green); border: 1px solid rgba(59,109,17,0.25); }
.status-rejected { background: var(--red-light); color: var(--red); border: 1px solid rgba(226,75,74,0.25); }
.status-paid     { background: #e8f0fe; color: #1a56db; border: 1px solid rgba(26,86,219,0.25); }

/* ── Pay summary block ── */
.pay-section { background: var(--green-light); border: 1.5px solid rgba(59,109,17,0.3); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
.pay-section h3 { font-size: 15px; font-weight: 700; color: var(--green); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.pay-section p   { font-size: 13px; color: #3a5520; margin-bottom: 1rem; }

/* ── Payment method tabs ── */
.pay-tabs { display: flex; margin-bottom: 1.25rem; border-radius: var(--radius-sm); overflow: hidden; border: 1.5px solid var(--border); }
.pay-tab-btn {
  flex: 1; padding: 10px 8px; border: none; font-size: 13px; font-weight: 600;
  font-family: inherit; background: var(--bg); color: var(--text2); cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
  border-right: 1px solid var(--border);
}
.pay-tab-btn:last-child { border-right: none; }
.pay-tab-btn.active { background: var(--blue); color: #fff; }
.pay-tab-content { display: none; }
.pay-tab-content.active { display: block; }

/* ── QR box ── */
.qr-payment-box { background: #fff; border: 2px solid #005BAA; border-radius: var(--radius); padding: 1.25rem; text-align: center; margin-bottom: 1.25rem; }
.qr-thai-header { background: #005BAA; color: #fff; border-radius: var(--radius-sm); padding: 10px 16px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
.qr-logos { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
.qr-logo-badge { background: #f0f4f9; border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; font-size: 11px; font-weight: 700; color: #005BAA; }
#qrCanvas { display: flex; justify-content: center; margin: 12px auto; }
#qrCanvas canvas, #qrCanvas img { border-radius: 8px; border: 4px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
.qr-amount-badge { background: linear-gradient(135deg, #005BAA, #185FA5); color: #fff; border-radius: 20px; padding: 8px 24px; font-size: 20px; font-weight: 800; display: inline-block; margin: 10px 0; letter-spacing: 1px; }
.qr-merchant-id { font-size: 11px; color: var(--text2); margin-top: 6px; line-height: 1.7; }
.qr-note { background: #fff9e6; border: 1px solid rgba(200,146,42,0.3); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #7a5a10; margin-top: 10px; text-align: left; line-height: 1.7; }

/* ── Upload ── */
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 1.75rem; text-align: center; cursor: pointer;
  transition: all 0.15s; background: var(--bg); position: relative;
}
.upload-area:hover  { border-color: var(--blue); background: var(--blue-light); }
.upload-area.drag-over { border-color: var(--blue); background: var(--blue-light); transform: scale(1.01); }
.upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 32px; color: var(--text2); }
.upload-area p    { font-size: 13px; color: var(--text2); margin-top: 6px; }
.upload-area .hint { font-size: 11px; color: var(--text2); margin-top: 4px; opacity: 0.7; }
.preview-img { max-width: 100%; max-height: 220px; border-radius: var(--radius-sm); margin-top: 12px; display: none; object-fit: contain; }
.upload-progress { margin-top: 10px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; display: none; }
.upload-progress-bar { height: 100%; background: var(--blue); border-radius: 3px; transition: width 0.3s; width: 0%; }

/* ── Notices ── */
.notice { border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
.notice h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.notice p  { font-size: 13px; line-height: 1.7; }
.notice-rejected { background: var(--red-light); border: 1px solid rgba(226,75,74,0.3); }
.notice-rejected h3 { color: var(--red); }
.notice-rejected p  { color: #7a2020; }
.notice-paid { background: #e8f0fe; border: 1px solid rgba(26,86,219,0.25); }
.notice-paid h3 { color: #1a56db; }
.notice-paid p  { color: #1a3a8a; }
.notice-done { background: #d1fae5; border: 1px solid rgba(6,95,70,0.25); }
.notice-done h3 { color: #065f46; }
.notice-done p  { color: #064e3b; }
.notice-cancelled { background: #f3f4f6; border: 1px solid #d1d5db; }
.notice-cancelled h3 { color: #374151; }
.notice-cancelled p  { color: #6b7280; }
.notice-pending { background: var(--gold-light); border: 1px solid rgba(200,146,42,0.3); }
.notice-pending h3 { color: var(--gold); }
.notice-pending p  { color: #7a5a10; }

/* ── Alert strip ── */
.alert-strip { border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-top: 8px; display: none; }
.alert-strip.err { background: var(--red-light); color: #7a2020; border: 1px solid rgba(226,75,74,0.3); }
.alert-strip.ok  { background: var(--green-light); color: #2a5010; border: 1px solid rgba(59,109,17,0.25); }

/* ── Not found ── */
.not-found { text-align: center; padding: 2.5rem 1rem; }
.not-found-icon { font-size: 48px; margin-bottom: 1rem; }
.not-found h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.not-found p  { font-size: 14px; color: var(--text2); line-height: 1.7; }

/* ── Overlay spinner ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 999; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
.overlay.show { display: flex; }
.spinner { width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
.overlay p { color: #fff; font-size: 15px; font-weight: 500; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Thank-you page ── */
.thankyou-page { text-align: center; padding: 1.5rem 0.5rem; }
.success-icon-big { width: 80px; height: 80px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 40px; border: 3px solid rgba(59,109,17,0.3); }
.ref-box-sm { background: linear-gradient(135deg, #0C3A6B 0%, #185FA5 100%); border-radius: var(--radius); padding: 14px 24px; display: inline-block; margin: 1rem 0; }
.ref-box-sm .ref-label { font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
.ref-box-sm span { font-size: 24px; font-weight: 700; letter-spacing: 3px; color: #fff; display: block; }

#resultArea   { display: none; }
#thankYouArea { display: none; }
</style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <div class="header">
    <a href="index.html" class="back-link"><i class="ti ti-arrow-left"></i> หน้าหลัก</a>
    <div class="hbadge">ตรวจสอบสถานะ</div>
    <h1>ตรวจสอบสถานะการจอง</h1>
    <p>ใช้เลขอ้างอิง (Ref No.) หรือเลขประจำตัวผู้ต้องขัง</p>
  </div>

  <!-- ── Search ── -->
  <div class="search-section">
    <div class="section-title"><i class="ti ti-search"></i> ค้นหาการจอง</div>
    <div class="search-tabs">
      <button class="tab-btn active" id="tabRef" onclick="switchTab('ref')">
        <i class="ti ti-hash"></i> Ref No.
      </button>
      <button class="tab-btn" id="tabPrisoner" onclick="switchTab('prisoner')">
        <i class="ti ti-lock"></i> เลขผู้ต้องขัง
      </button>
    </div>
    <div class="tab-content active" id="tabContentRef">
      <label>เลขอ้างอิง (เช่น VIS-12345)</label>
      <input type="text" id="searchRef" placeholder="VIS-XXXXX"
        style="text-transform:uppercase;letter-spacing:1px"
        onkeydown="if(event.key==='Enter') doSearch()">
    </div>
    <div class="tab-content" id="tabContentPrisoner">
      <label>หมายเลขผู้ต้องขัง</label>
      <input type="text" id="searchPrisoner" placeholder="เช่น 12345678"
        onkeydown="if(event.key==='Enter') doSearch()">
    </div>
    <div style="margin-top:12px">
      <button class="btn-primary" id="searchBtn" onclick="doSearch()">
        <i class="ti ti-search"></i> ตรวจสอบสถานะ
      </button>
    </div>
  </div>

  <!-- ── Result / Thank-you areas (populated by JS) ── -->
  <div id="resultArea"></div>

  <div id="thankYouArea">
    <div class="thankyou-page">
      <div class="success-icon-big">🎉</div>
      <h2 style="font-size:22px;font-weight:700;margin-bottom:8px">ชำระเงินและจองสำเร็จ!</h2>
      <p style="font-size:14px;color:var(--text2);margin-bottom:1rem">เจ้าหน้าที่จะยืนยันนัดหมายผ่านโทรศัพท์ภายใน 1 วันทำการ</p>
      <div class="ref-box-sm">
        <div class="ref-label">เลขอ้างอิง</div>
        <span id="tyRefNumber">VIS-00000</span>
      </div>
      <div id="tySummary" style="background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);padding:14px;text-align:left;margin:1rem 0;font-size:13px;line-height:2.2"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:1rem">
        <button class="btn-secondary" onclick="resetSearch()" style="flex:1;min-width:160px">
          <i class="ti ti-search"></i> ค้นหาอีกครั้ง
        </button>
        <a href="index.html" class="btn-primary" style="text-decoration:none;flex:1;min-width:160px">
          <i class="ti ti-home"></i> กลับหน้าหลัก
        </a>
      </div>
    </div>
  </div>

</div>

<!-- ── Overlay ── -->
<div class="overlay" id="overlay">
  <div class="spinner"></div>
  <p id="overlayMsg">กำลังค้นหา...</p>
</div>

<script>
// ================================================================
//  CONFIG
// ================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYTAy4xe5z6tv5y0F3mjLqMdvYuothFRWUWz6MAkpq6xbusyOTFHvu7-YA2Z8HMhGDjw/exec';
const STAFF_PASS      = '10900';
const MERCHANT_ID     = 'ML099400ZO0160208VX';
const PRICE_PER_PERSON = 1;   // 1 บาท / คน

// ================================================================
//  APPS SCRIPT HELPERS
//  Google Apps Script ต้องใช้ redirect:'follow' + Content-Type:'text/plain'
//  เพื่อหลีกเลี่ยง CORS preflight ที่ Apps Script รองรับไม่ได้
// ================================================================
async function appsScriptGet(params) {
  const qs   = new URLSearchParams(params).toString();
  const resp = await fetch(APPS_SCRIPT_URL + '?' + qs, { redirect: 'follow' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const text = await resp.text();
  try { return JSON.parse(text); }
  catch { throw new Error('Invalid JSON: ' + text.slice(0, 120)); }
}

async function appsScriptPost(payload) {
  const resp = await fetch(APPS_SCRIPT_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const text = await resp.text();
  try { return JSON.parse(text); }
  catch { throw new Error('Invalid JSON: ' + text.slice(0, 120)); }
}

// ================================================================
//  SEARCH TAB SWITCH
// ================================================================
let activeTab = 'ref';
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabRef').classList.toggle('active', tab === 'ref');
  document.getElementById('tabPrisoner').classList.toggle('active', tab === 'prisoner');
  document.getElementById('tabContentRef').classList.toggle('active', tab === 'ref');
  document.getElementById('tabContentPrisoner').classList.toggle('active', tab === 'prisoner');
}

// Pre-fill จาก sessionStorage (ถ้ามาจากหน้า booking)
window.addEventListener('load', () => {
  try {
    const lastRef = sessionStorage.getItem('lastRef');
    const lastPId = sessionStorage.getItem('lastPrisonerId');
    if (lastRef)  { document.getElementById('searchRef').value = lastRef; switchTab('ref'); }
    else if (lastPId) { document.getElementById('searchPrisoner').value = lastPId; switchTab('prisoner'); }
  } catch(e) {}
});

// ================================================================
//  SEARCH
// ================================================================
async function doSearch() {
  const mode  = activeTab;
  let   query = '';
  if (mode === 'ref') {
    query = document.getElementById('searchRef').value.trim().toUpperCase();
    if (!query) { alert('กรุณากรอกเลขอ้างอิง'); return; }
  } else {
    query = document.getElementById('searchPrisoner').value.trim();
    if (!query) { alert('กรุณากรอกหมายเลขผู้ต้องขัง'); return; }
  }

  setOverlay(true, 'กำลังค้นหา...');
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('resultArea').style.display   = 'none';
  document.getElementById('thankYouArea').style.display = 'none';

  let rows = [];
  try {
    const data = await appsScriptGet({ action: 'getAll', pass: STAFF_PASS });
    if (data.status === 'ok') rows = data.rows || [];
    else throw new Error(data.message || 'error');
  } catch(err) {
    console.error('Fetch error:', err);
    // Fallback: demo data เฉพาะเมื่อ URL ยังเป็น placeholder
    if (APPS_SCRIPT_URL.includes('YOUR_GOOGLE')) {
      rows = getDemoRows();
    } else {
      setOverlay(false);
      document.getElementById('searchBtn').disabled = false;
      renderError('ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง');
      return;
    }
  } finally {
    setOverlay(false);
    document.getElementById('searchBtn').disabled = false;
  }

  let found = null;
  if (mode === 'ref') {
    found = rows.find(r => (r.ref || '').toUpperCase() === query) || null;
  } else {
    const matches = rows.filter(r => String(r.prisonerId || '').trim() === query);
    if (matches.length) found = matches[0];
  }

  if (!found) renderNotFound(query);
  else        renderResult(found);
}

// ================================================================
//  RENDER HELPERS
// ================================================================
function renderError(msg) {
  const area = document.getElementById('resultArea');
  area.style.display = 'block';
  area.innerHTML = `
    <div style="background:var(--red-light);border:1px solid rgba(226,75,74,0.3);border-radius:var(--radius);padding:1.25rem;text-align:center;">
      <div style="font-size:32px;margin-bottom:8px">⚠️</div>
      <div style="font-weight:600;color:var(--red);margin-bottom:4px">เกิดข้อผิดพลาด</div>
      <div style="font-size:13px;color:#7a2020">${escHtml(msg)}</div>
    </div>`;
}

function renderNotFound(query) {
  const area = document.getElementById('resultArea');
  area.style.display = 'block';
  area.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 2px 8px rgba(0,0,0,0.04);">
      <div class="not-found">

function getStatusPill(status) {
  const s = (status || '').toLowerCase();
  if (s === 'รอชำระเงิน')                     return `<span class="status-pill status-approved">✅ อนุมัติ — รอชำระเงิน</span>`;
  if (s.includes('อนุมัติ') || s === 'approved') return `<span class="status-pill status-approved">✅ อนุมัติแล้ว</span>`;
  if (s.includes('ไม่อนุมัติ') || s === 'rejected') return `<span class="status-pill status-rejected">❌ ไม่อนุมัติ</span>`;
  if (s === 'เสร็จสิ้น')                      return `<span class="status-pill status-paid" style="background:#d1fae5;color:#065f46;border-color:rgba(6,95,70,0.3)">✅ เสร็จสิ้นแล้ว</span>`;
  if (s.includes('ชำระ') || s === 'paid')     return `<span class="status-pill status-paid">💳 รอยืนยัน</span>`;
  if (s === 'ยกเลิก')                          return `<span class="status-pill" style="background:#f3f4f6;color:#374151;border:1px solid #d1d5db">🚫 ยกเลิก</span>`;
  return `<span class="status-pill status-pending">⏳ รอตรวจสอบ</span>`;
}

function calcTotal(row) {
  const visitorCount = parseInt(row.visitorCount) || 1;
  const totalPersons = visitorCount + 1;
  // ถ้ามีค่าใน row.total ให้ใช้ค่านั้น (override จาก sheet)
  // ถ้าไม่มีให้คำนวณจาก PRICE_PER_PERSON
  const total = parseFloat(row.total) || (totalPersons * PRICE_PER_PERSON);
  return { visitorCount, totalPersons, total };
}

// ================================================================
//  PROMPTPAY QR  (EMVCo, reverse-engineered from real Krungthai QR)
// ================================================================
function buildPromptPayPayload(merchantId, amount) {

  function crc16(str) {
    let crc = 0xFFFF;
    for (let i = 0; i < str.length; i++) {
      crc ^= str.charCodeAt(i) << 8;
      for (let j = 0; j < 8; j++) {
        crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
  }

  function tlv(tag, value) {
    return tag + String(value.length).padStart(2, '0') + value;
  }

  // Tag 29 — PromptPay Bill Payment (structure from real Krungthai QR)
  const aid   = tlv('00', 'A000000677010112');  // PromptPay AID
  const sub01 = tlv('01', '010753700088205');    // Biller ID (Krungthai)
  const sub02 = tlv('02', merchantId);           // Merchant / Shop ID
  const sub03 = tlv('03', 'CIDA');               // Ref2
  const tag29 = tlv('29', aid + sub01 + sub02 + sub03);

  const amountStr = parseFloat(amount).toFixed(2);
  const tag62 = tlv('62', tlv('07', '0000'));    // Additional Data

  let payload = '';
  payload += tlv('00', '01');       // Payload Format Indicator
  payload += tlv('01', '11');       // Dynamic QR (amount embedded)
  payload += tag29;
  payload += tlv('53', '764');      // Currency: THB
  payload += tlv('54', amountStr);  // Transaction Amount
  payload += tlv('58', 'TH');       // Country Code
  payload += tag62;
  payload += '6304';                // CRC placeholder tag+len

  return payload + crc16(payload);
}

function generatePromptPayQR(merchantId, amount) {
  const canvas = document.getElementById('qrCanvas');
  if (!canvas) return;
  canvas.innerHTML = '';
  try {
    const payload = buildPromptPayPayload(merchantId, amount);
    new QRCode(canvas, {
      text: payload,
      width: 220, height: 220,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {
    canvas.innerHTML = `<div style="padding:20px;color:var(--red);font-size:12px;">ไม่สามารถสร้าง QR Code ได้: ${escHtml(e.message)}</div>`;
  }
}

// ================================================================
//  DRAG & DROP / FILE UPLOAD
// ================================================================
function handleDragOver(e)  { e.preventDefault(); document.getElementById('uploadArea').classList.add('drag-over'); }
function handleDragLeave()  { document.getElementById('uploadArea').classList.remove('drag-over'); }
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadArea').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}
function handleUpload(e) {
  const file = e.target.files[0];
  if (file) processFile(file);
}

function processFile(file) {
  if (file.size > 10 * 1024 * 1024) {
    showUploadAlert('err', '❌ ไฟล์ใหญ่เกิน 10MB กรุณาเลือกไฟล์ที่เล็กกว่า');
    return;
  }
  if (!file.type.startsWith('image/')) {
    showUploadAlert('err', '❌ รองรับเฉพาะไฟล์รูปภาพ (JPG, PNG) เท่านั้น');
    return;
  }
  slipFile     = file;
  slipUploaded = true;
  hideUploadAlert();

  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.getElementById('previewImg');
    img.src = ev.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);

  document.getElementById('uploadInner').style.opacity = '0.4';
  document.getElementById('uploadStatus').innerHTML =
    `✓ เลือกไฟล์แล้ว: <strong>${escHtml(file.name)}</strong><br>` +
    `<span style="font-size:11px;color:var(--text2)">ขนาด: ${(file.size/1024).toFixed(1)} KB · จะอัปโหลดเมื่อกดยืนยัน</span>`;
}

function showUploadAlert(type, msg) {
  const el = document.getElementById('uploadAlert');
  el.className = 'alert-strip ' + type;
  el.innerHTML = msg;
  el.style.display = 'block';
}
function hideUploadAlert() {
  const el = document.getElementById('uploadAlert');
  if (el) el.style.display = 'none';
}

function animateProgress(from, to) {
  const bar  = document.getElementById('uploadProgressBar');
  const wrap = document.getElementById('uploadProgress');
  if (!bar || !wrap) return;
  wrap.style.display = 'block';
  bar.style.width = from + '%';
  setTimeout(() => { bar.style.width = to + '%'; }, 50);
}

// ================================================================
//  UPLOAD SLIP → Google Drive via Apps Script
// ================================================================
async function uploadSlipViaAppsScript(file, ref) {
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
    reader.readAsDataURL(file);
  });

  animateProgress(10, 60);

  const result = await appsScriptPost({
    action: 'uploadSlip',
    pass: STAFF_PASS,
    ref, fileName: file.name, mimeType: file.type, base64Data: base64
  });

  animateProgress(60, 100);

  if (result.status !== 'ok') throw new Error(result.message || 'อัปโหลดไม่สำเร็จ');
  return result.url;
}

// ================================================================
//  SUBMIT PAYMENT
// ================================================================
async function submitPayment() {
  if (!slipUploaded || !slipFile) {
    showUploadAlert('err', '❌ กรุณาเลือกรูปสลิปการโอนเงินก่อน');
    return;
  }
  if (!currentBooking) return;

  const submitBtn = document.getElementById('paySubmitBtn');
  submitBtn.disabled = true;
  setOverlay(true, 'กำลังอัปโหลดสลิป...');

  let slipUrl = '';
  try {
    slipUrl = await uploadSlipViaAppsScript(slipFile, currentBooking.ref);
  } catch (uploadErr) {
    console.error('Slip upload error:', uploadErr);
    setOverlay(false);
    submitBtn.disabled = false;
    const wrap = document.getElementById('uploadProgress');
    if (wrap) wrap.style.display = 'none';
    showUploadAlert('err',
      '❌ อัปโหลดสลิปไม่สำเร็จ: ' + escHtml(uploadErr.message || 'กรุณาลองใหม่') +
      '<br>หากยังไม่สำเร็จ กรุณาติดต่อเจ้าหน้าที่');
    return;
  }

  // อัปเดต status ใน Google Sheet
  setOverlay(true, 'กำลังบันทึกการชำระเงิน...');
  try {
    const result = await appsScriptPost({
      action: 'updateSlipAndStatus',
      pass: STAFF_PASS,
      ref: currentBooking.ref,
      status: 'ชำระแล้ว',
      slipImage: slipUrl
    });
    if (result.status !== 'ok') throw new Error(result.message || 'บันทึกไม่สำเร็จ');
  } catch (err) {
    // slip อัปโหลดสำเร็จแล้ว ไม่ block UX
    console.error('Update status error:', err);
  } finally {
    setOverlay(false);
  }

  showThankYou();
}

// ================================================================
//  THANK YOU
// ================================================================
function showThankYou() {
  const row = currentBooking;
  const { visitorCount, totalPersons, total } = calcTotal(row);
  const fmtTotal = total.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  document.getElementById('resultArea').style.display   = 'none';
  document.getElementById('thankYouArea').style.display = 'block';
  document.getElementById('tyRefNumber').textContent = row.ref;
  document.getElementById('tySummary').innerHTML = `
    <div>📋 <strong>Ref No.:</strong> ${escHtml(row.ref)}</div>
    <div>👤 <strong>ผู้เยี่ยม:</strong> ${escHtml(row.visitorName)}</div>
    <div>🔒 <strong>ผู้ต้องขัง:</strong> ${escHtml(row.prisonerName)} (#${escHtml(row.prisonerId)})</div>
    <div>🏢 <strong>แดน:</strong> ${escHtml(row.wing)}</div>
    <div>📅 <strong>วันที่:</strong> ${escHtml(row.visitDate)}</div>
    <div>👥 <strong>จำนวน:</strong> ${totalPersons} คน</div>
    <div>💰 <strong>ยอดชำระ:</strong> ${fmtTotal} บาท ✓</div>`;
  window.scrollTo(0, 0);
}

// ================================================================
//  RESET
// ================================================================
function resetSearch() {
  document.getElementById('searchRef').value      = '';
  document.getElementById('searchPrisoner').value = '';
  document.getElementById('resultArea').style.display   = 'none';
  document.getElementById('thankYouArea').style.display = 'none';
  currentBooking = null;
  slipFile       = null;
  slipUploaded   = false;
  window.scrollTo(0, 0);
}

// ================================================================
//  OVERLAY
// ================================================================
function setOverlay(show, msg) {
  const el = document.getElementById('overlay');
  el.classList.toggle('show', show);
  if (msg) document.getElementById('overlayMsg').textContent = msg;
}

// ================================================================
//  UTILS
// ================================================================
function escHtml(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
